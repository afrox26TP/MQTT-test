services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-rfid-app
    depends_on:
      - mosquitto
    env_file:
      - .env
    ports:
      - "8000:8000"
