services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-rfid-app
    env_file:
      - .env
    environment:
      PRESENCE_CONFIG: /app/config/nedvezska.json
      DATA_DIR: /app/data
    volumes:
      - presence_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  presence_data:
